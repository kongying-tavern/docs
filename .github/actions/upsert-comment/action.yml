name: Upsert PR Comment
description: >-
  Create or update a single comment on a pull request, located by an HTML
  marker. Only one comment per marker is kept (equivalent to the removed
  actions-cool/maintain-one-comment behavior).

inputs:
  issue-number:
    description: Pull request number to comment on
    required: true
  marker:
    description: Unique HTML marker used to find the existing comment
    required: true
  body:
    description: >-
      Comment body (multi-line). Should contain the marker so the comment can
      be found and updated on later runs.
    required: true

runs:
  using: composite
  steps:
    - name: Create or update comment
      uses: actions/github-script@v9
      with:
        script: |
          const marker = ${{ toJSON(inputs.marker) }};
          const body = ${{ toJSON(inputs.body) }};
          const issue_number = Number(${{ toJSON(inputs['issue-number']) }});
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number,
            per_page: 100
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
          }
