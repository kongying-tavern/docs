name: Forum UI

on:
  push:
    branches: [main]
    paths: ['src/**', '.vitepress/**', 'tests/e2e/**', 'tests/forum/**', 'tests/theme/**', vitest.config.ts, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .github/workflows/forum-ui.yml, '.github/actions/setup/**', vite.config.ts, unocss.config.ts, .nvmrc, .python-version, requirements.txt, 'scripts/fonts/**', 'scripts/font_subset/**', scripts/buildFonts.ts]
  pull_request:
    branches: [main]
    paths: ['src/**', '.vitepress/**', 'tests/e2e/**', 'tests/forum/**', 'tests/theme/**', vitest.config.ts, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .github/workflows/forum-ui.yml, '.github/actions/setup/**', vite.config.ts, unocss.config.ts, .nvmrc, .python-version, requirements.txt, 'scripts/fonts/**', 'scripts/font_subset/**', scripts/buildFonts.ts]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forum-ui-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  forum-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [production, source]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck:forum:ui
      - name: Build production site
        if: matrix.suite == 'production'
        run: pnpm test:forum:ui:build
        env:
          VITE_COLADA_DEVTOOLS: 'false'
          VITE_DEVTOOLS: 'false'
      - run: pnpm test:forum:ui:${{ matrix.suite }}
      - run: pnpm test:theme:ui
        if: matrix.suite == 'source'
        env:
          SWIPE_BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: forum-ui-${{ matrix.suite }}-failure
          path: |
            test-results/forum
            playwright-report
          retention-days: 7
