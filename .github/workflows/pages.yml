name: GITHUB_PAGE

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

# 串行排队，但不取消在跑任务，避免中断进行中的 Pages 部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 变更门禁（黑名单见 .github/filters.yml）
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check pages-relevant changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yml
          base: ${{ github.event.before }}
          predicate-quantifier: some-with-excludes

  build:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要完整 git 历史（“最近更新时间”等）
          fetch-depth: 0

      - name: Setup Node.js, pnpm and Python toolchain
        uses: ./.github/actions/setup

      - name: Build site
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
