name: DEPLOYMENT

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# 串行部署：新提交取消旧部署，避免 rsync --delete 互相覆盖
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # 变更门禁（黑名单见 .github/filters.yml）
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check deploy-relevant changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yml
          base: ${{ github.event.before }}
          predicate-quantifier: some-with-excludes

  build:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment:
      name: Production
      url: https://yuanshen.site/docs/

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要完整 git 历史（“最近更新时间”等）
          fetch-depth: 0

      - name: Setup Node.js, pnpm and Python toolchain
        uses: ./.github/actions/setup

      - name: Refresh Members Data
        run: pnpm build:member
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_PASSWORD: ${{ secrets.GITEE_PASSWORD }}

      - name: Refresh Emoji Data
        run: pnpm build:emoji

      - name: Build Site
        run: pnpm build:vitepress

      - name: Build Lunaria
        run: pnpm lunaria:build

      - name: Deploy
        id: deploy
        uses: easingthemes/ssh-deploy@v6.0.3
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ACCESS_TOKEN }}
          # rsync --delete：全量同步
          ARGS: '-avz --delete'
          SOURCE: './dist/'
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.TARGET }}
