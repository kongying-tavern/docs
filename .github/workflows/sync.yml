# 翻译认领看板同步：push 到 main 或手动触发时对账 Lunaria 状态并更新认领 issue
name: Translation tracker sync
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lunaria-claim-sync

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Lunaria 需要完整 git 历史
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install
      - run: pnpm lunaria:build
      - uses: jiazengp/lunaria-claim@v1
        with:
          mode: sync
          # 与 lunaria.config.json 的 outDir 对应，status.json 就在其下
          status-json: ./dist/_translations/status.json