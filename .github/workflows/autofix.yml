name: autofix.ci

on:
  pull_request:
    paths:
      - 'src/**'
      - '.vitepress/**'
      - 'scripts/**'
      - '**/zh/**/*.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eslint.config.ts'

permissions:
  # autofix-ci 回推修复 commit 需要写权限
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run eslint
        run: pnpm lint:eslint:fix

      - name: Run Zhlint fix
        run: pnpm lint:zh:fix

      - name: Run autofix
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
