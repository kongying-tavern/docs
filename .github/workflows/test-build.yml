name: TEST_BUILD

on:
  workflow_call:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要完整 git 历史（“最近更新时间”等）
          fetch-depth: 0

      - name: Cache font subsets
        uses: actions/cache@v4
        with:
          path: |
            src/public/fonts
            .vitepress/theme/styles/fonts-subset.css
            .vitepress/theme/styles/fonts-standard.css
          # Standard-tier inputs only; the site tier depends on page text and
          # is cheap to rebuild, so it is intentionally excluded from the key.
          key: font-subset-${{ hashFiles('scripts/fonts/font-subset.config.json', 'scripts/fonts/font-characters.config.json', 'scripts/fonts/font-slicing.config.json', 'scripts/fonts/source/**', 'scripts/font_subset/**', 'scripts/buildFonts.ts', 'requirements.txt') }}

      - name: Setup Node.js, pnpm and Python toolchain
        uses: ./.github/actions/setup

      - name: Refresh Emoji Data
        run: pnpm build:emoji

      - name: Build
        run: pnpm site:preview

      - name: Build Lunaria
        run: pnpm lunaria:build

      - name: Zip site artifact
        run: |
          zip -r _site.zip ./dist

      - name: Upload _site artifact
        uses: actions/upload-artifact@v7
        with:
          name: _site
          path: _site.zip
          retention-days: 5

      - name: Save PR number
        if: ${{ always() }}
        run: echo ${{ github.event.number }} > ./pr-id.txt

      - name: Upload PR number
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pr
          path: ./pr-id.txt
