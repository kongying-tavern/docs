name: PREVIEW

on:
  workflow_call:
    secrets:
      SURGE_TOKEN:
        required: true
  workflow_run:
    workflows: ['TEST_BUILD']
    types:
      - completed

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  preview-success:
    runs-on: ubuntu-latest
    # environment.url 在 job 收尾时求值，支持 steps 上下文
    environment:
      name: Preview
      url: ${{ steps.deploy.outputs.url }}
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download PR artifact
        uses: actions/download-artifact@v8
        with:
          name: pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save PR ID
        id: pr
        run: echo "id=$(<pr-id.txt)" >> "$GITHUB_OUTPUT"

      - name: Download _site artifact
        uses: actions/download-artifact@v8
        with:
          name: _site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract _site artifact
        run: |
          unzip -o _site.zip

      - name: Upload surge service and generate preview URL
        id: deploy
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          repository=${{ github.repository }}
          project_name=${repository#*/}
          export DEPLOY_DOMAIN=https://kongying-tavern-preview-pr${{ steps.pr.outputs.id }}-$project_name.surge.sh
          npx surge@0.43.0 --project ./dist --domain $DEPLOY_DOMAIN
          echo "url=$DEPLOY_DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Update status comment
        uses: ./.github/actions/upsert-comment
        with:
          issue-number: ${{ steps.pr.outputs.id }}
          marker: '<!-- AUTO_PREVIEW_HOOK -->'
          body: |
            <a href="${{ steps.deploy.outputs.url }}"><img alt="成功" src="https://assets.yuanshen.site/images/privew_is_ready_v1.png"></a>
            <!-- [工作流地址](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) -->
            <!-- AUTO_PREVIEW_HOOK -->

      - name: Post failure comment
        if: ${{ failure() }}
        uses: ./.github/actions/upsert-comment
        with:
          issue-number: ${{ steps.pr.outputs.id }}
          marker: '<!-- AUTO_PREVIEW_HOOK -->'
          body: |
            [<img alt="失败" src="https://assets.yuanshen.site/images/privew_failed_v1.png">](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            <!-- AUTO_PREVIEW_HOOK -->

  preview-failed:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download PR artifact
        uses: actions/download-artifact@v8
        with:
          name: pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save PR ID
        id: pr
        run: echo "id=$(<pr-id.txt)" >> "$GITHUB_OUTPUT"

      - name: Post failure comment
        uses: ./.github/actions/upsert-comment
        with:
          issue-number: ${{ steps.pr.outputs.id }}
          marker: '<!-- AUTO_PREVIEW_HOOK -->'
          body: |
            [<img alt="失败" src="https://assets.yuanshen.site/images/privew_failed_v1.png">](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            <!-- AUTO_PREVIEW_HOOK -->
