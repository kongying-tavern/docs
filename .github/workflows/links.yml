name: LINKS

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - '**/.github/**'
  workflow_dispatch:
  repository_dispatch:
  schedule:
    - cron: '00 18 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # github.workspace is only known at CI runtime, so this remap stays in args.
          args: >-
            --config lychee.toml
            --remap '^https://github\.com/kongying-tavern/docs/blob/main/(.*)$ file://${{ github.workspace }}/$1'
            './**/*.md'
            './**/*.html'
            './**/*.rst'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update issue
        if: ${{ failure() && steps.lychee.outputs.exit_code != '' && steps.lychee.outputs.exit_code != '0' && github.event_name != 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs')
            const body = fs.readFileSync('lychee/out.md', 'utf8')
            const { owner, repo } = context.repo
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
              sort: 'created',
              direction: 'desc',
            })
            const reports = openIssues.filter(issue => !issue.pull_request && issue.title === 'Link Checker Report')
            const [current, ...duplicates] = reports

            if (current) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: current.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: 'Link Checker Report',
                body,
                labels: ['report', 'automated issue'],
              })
            }

            for (const issue of duplicates) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned',
              })
            }

      - name: Close resolved report
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
              sort: 'created',
              direction: 'desc',
            })
            const reports = openIssues.filter(issue => !issue.pull_request && issue.title === 'Link Checker Report')

            for (const issue of reports) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              })
            }
