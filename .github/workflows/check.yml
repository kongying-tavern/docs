name: CHECK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.vitepress/**'
      - 'scripts/**'
      - 'package.json'
      - 'requirements.txt'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.ts'
      - 'vite.config.ts'
      - 'unocss.config.ts'
      - 'tsconfig.json'
      - '.nvmrc'
      - '.python-version'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - '.vitepress/**'
      - 'scripts/**'
      - 'package.json'
      - 'requirements.txt'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.ts'
      - 'vite.config.ts'
      - 'unocss.config.ts'
      - 'tsconfig.json'
      - '.nvmrc'
      - '.python-version'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要完整 git 历史（“最近更新时间”等）
          fetch-depth: 0

      - name: Setup Node.js, pnpm and Python toolchain
        uses: ./.github/actions/setup

      - name: ESLint
        run: pnpm lint:eslint

      - name: Font subset unit tests
        run: pnpm test:fonts

      - name: Build project (MPA)
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: pnpm build:mpa
