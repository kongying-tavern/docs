name: CHECK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.vitepress/**'
      - 'scripts/**'
      - 'package.json'
      - 'requirements.txt'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.ts'
      - 'vite.config.ts'
      - 'unocss.config.ts'
      - 'tsconfig.json'
      - '.nvmrc'
      - '.python-version'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - '.vitepress/**'
      - 'scripts/**'
      - 'package.json'
      - 'requirements.txt'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.ts'
      - 'vite.config.ts'
      - 'unocss.config.ts'
      - 'tsconfig.json'
      - '.nvmrc'
      - '.python-version'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  forum-smoke:
    # 论坛真实浏览器冒烟测试复用 E2E 工作流的 playwright job
    uses: ./.github/workflows/e2e.yml

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要完整 git 历史（“最近更新时间”等）
          fetch-depth: 0

      - name: Cache font subsets
        uses: actions/cache@v4
        with:
          path: |
            src/public/fonts
            .vitepress/theme/styles/fonts-subset.css
            .vitepress/theme/styles/fonts-standard.css
          # Standard-tier inputs only; the site tier depends on page text and
          # is cheap to rebuild, so it is intentionally excluded from the key.
          key: font-subset-${{ hashFiles('scripts/fonts/font-subset.config.json', 'scripts/fonts/font-characters.config.json', 'scripts/fonts/font-slicing.config.json', 'scripts/fonts/source/**', 'scripts/font_subset/**', 'scripts/buildFonts.ts', 'requirements.txt') }}

      - name: Setup Node.js, pnpm and Python toolchain
        uses: ./.github/actions/setup

      - name: ESLint
        run: pnpm lint:eslint

      - name: Typecheck
        run: pnpm typecheck

      - name: Forum unit tests
        run: pnpm test:forum

      - name: Font subset unit tests
        run: pnpm test:fonts

      - name: Build project (MPA)
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: pnpm build:mpa
