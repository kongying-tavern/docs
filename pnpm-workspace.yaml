minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@playwright/test@1.64.0'
  - playwright-core@1.64.0
  - playwright@1.64.0
  - '@pinia/colada@1.4.8'
  - '@x18n/builtins@0.1.1'
  - '@x18n/cli@0.1.1'
  - '@x18n/core@0.1.1'
  - '@x18n/node@0.1.1'
  - '@x18n/ui@0.1.1'
  - '@intlify/bundle-utils@11.2.8'
  - '@intlify/unplugin-vue-i18n@11.2.8'
  - '@lucide/vue@1.78.0'
  - '@tanstack/virtual-core@3.19.13'
  - '@tanstack/vue-virtual@3.13.54'

trustPolicy: no-downgrade
# Approved exceptions for existing locked versions in the VitePress toolchain.
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
  - vite@5.4.21

# vue-sonner 等包的 Nuxt optional peer 会被自动安装并拖入整棵 Nuxt DevTools
# 依赖树（含 Critical 告警且完全未被使用），关闭自动安装。
autoInstallPeers: false
shellEmulator: true
packages: []

overrides:
  '@comark/markdown-it>js-yaml': ^4.3.2
  # 14.2.0 同时提供 dist/* 与 lib/* 两套互不兼容的声明（utils.isPunctCharCode
  # 只在 lib 侧），而 @mdit 插件的 ^14.1.2 会解析到它，与 VitePress 的根导入及
  # 本仓 markdown-it/lib/* 深路径类型冲突，锁单副本 14.1.2。
  '@types/markdown-it': 14.1.2
  hast-util-to-html>mdast-util-to-hast: ^13.2.1
  micromatch>picomatch: ^2.3.2
  unconfig>defu: ^6.1.7
  vite>postcss: ^8.5.26
  vite>rollup: ^4.63.1

patchedDependencies:
  '@x18n/builtins@0.1.1': patches/@x18n__builtins@0.1.1.patch
# pnpm 11+ 以 allowBuilds 取代 ignoredBuiltDependencies；
# false = 保持 pnpm 10 时代显式忽略这些包构建脚本的行为
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  vue-demi: false

